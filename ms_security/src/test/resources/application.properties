# Configuracion SOLO para pruebas: base H2 en memoria y valores ficticios.
spring.application.name=security_ms_test

spring.datasource.url=jdbc:h2:mem:security_ms_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

security.jwt.secret=clave-ficticia-solo-para-pruebas-0123456789-abcdef
security.cors.allowed-origins=http://localhost:3000

email-service.url=http://127.0.0.1:5999
email-service.api-key=clave-ficticia-de-pruebas
security.two-factor.ttl-minutes=5
security.two-factor.max-attempts=3
security.two-factor.pepper=pepper-ficticio-de-pruebas

firebase.project-id=proyecto-de-prueba
firebase.unverified-email-providers=
